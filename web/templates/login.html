<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Домашние Финансы</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-2xl p-8">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">🔐 Вход в систему</h1>
        <p class="text-sm text-center text-slate-500 mb-6">Домашний сервис контроля денежных средств</p>

        <div id="login-error" class="hidden bg-rose-50 border border-rose-300 text-rose-700 px-4 py-3 rounded-lg text-sm mb-4"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Логин администратора</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Пароль</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition">
                Войти
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('login-error');
            errBox.classList.add('hidden');

            const formData = new FormData(e.target);
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    body: formData
                });
                if (!resp.ok) {
                    const data = await resp.json();
                    errBox.innerText = data.detail || 'Ошибка авторизации';
                    errBox.classList.remove('hidden');
                    return;
                }
                window.location.href = '/';
            } catch (err) {
                errBox.innerText = 'Сетевая ошибка соединения с сервером';
                errBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
