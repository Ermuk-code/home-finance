name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lifeos_test
          POSTGRES_PASSWORD: lifeos_test
          POSTGRES_DB: lifeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos_test -d lifeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOT_TOKEN: "123456:TEST"
      POSTGRES_USER: lifeos_test
      POSTGRES_PASSWORD: lifeos_test
      POSTGRES_DB: lifeos_test
      POSTGRES_HOST: localhost
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      TEST_POSTGRES_URL: postgresql+asyncpg://lifeos_test:lifeos_test@localhost:5432/lifeos_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests migrations

      - name: Migrations on disposable PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade 8d9b2a5f1e43
          alembic upgrade head

      - name: Pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t lifeos:ci .
