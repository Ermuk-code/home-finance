services:
  db:
    image: postgres:16-alpine
    container_name: finance_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: finance_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:8000:8000"
    # Код берётся из образа: после git pull нужен `docker compose up -d --build`.
    # Для разработки с живой подгрузкой кода: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
    depends_on:
      db:
        condition: service_healthy

  # Ежедневный pg_dump в ./backups (хранение BACKUP_KEEP_DAYS дней). Копируйте ./backups за пределы LXC!
  backup:
    image: postgres:16-alpine
    container_name: finance_backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
